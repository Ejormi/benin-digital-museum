<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Benin Digital Art Museum</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Benin Digital Art Museum</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="video.html">Videos</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Contact Me</h2>
        <p>
          If you'd like to get in touch, ask questions, or collaborate, feel
          free to send a message below.
        </p>

        <form
          action="https://usebasin.com/f/3ce219ae1524"
          method="POST"
          class="contact-form"
        >
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your full name"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          />

          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            placeholder="Type your message here..."
            rows="6"
            required
          ></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
    <footer>
      <p>created by okonkwo kingsley chibueze.</p>
    </footer>
  </body>
</html>
